databaseChangeLog:
  - changeSet:
      id: create-pet-table
      author: petstore
      changes:
        - createTable:
            tableName: pet
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: tag
                  type: varchar(255)
